<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Ecosistema | Tienderu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --primary: #4f46e5; --dark: #0f172a; --gray: #94a3b8; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--dark); overflow-x: hidden; padding: 20px; }

        .login-container { width: 100%; max-width: 900px; z-index: 10; }
        .login-card { background: white; display: grid; grid-template-columns: 40% 60%; border-radius: 24px; overflow: hidden; min-height: 550px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }

        /* Panel Izquierdo */
        .login-branding { background: #1e293b; padding: 40px; color: white; display: flex; flex-direction: column; justify-content: center; }
        .logo-wrapper { height: 45px; margin-bottom: 20px; }
        .login-logo-saas { height: 100%; width: auto !important; object-fit: contain; } /* [cite: 2026-01-25] */

        /* Panel Derecho */
        .login-form-side { padding: 40px; display: flex; flex-direction: column; justify-content: center; }
        .tab-switcher { display: flex; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid #eee; }
        .tab-btn { background: none; border: none; padding-bottom: 10px; cursor: pointer; font-weight: 800; color: var(--gray); font-size: 14px; transition: 0.3s; }
        .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); }

        /* Form Elements */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .full-w { grid-column: span 2; }
        .input-group { margin-bottom: 15px; position: relative; }
        .input-group label { display: block; font-size: 11px; font-weight: 800; margin-bottom: 5px; color: var(--dark); text-transform: uppercase; }
        .input-group input, .input-group select { width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 14px; outline: none; }
        .input-group input:focus { border-color: var(--primary); }

        .btn-auth { width: 100%; background: var(--primary); color: white; padding: 14px; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-auth:hover { background: #4338ca; transform: translateY(-2px); }

        /* Estilo para el botón de regreso */
        .btn-back { display: block; text-align: center; margin-top: 20px; color: var(--gray); text-decoration: none; font-size: 12px; font-weight: 700; transition: 0.3s; }
        .btn-back:hover { color: var(--primary); }

        .hidden { display: none; }

        @media (max-width: 800px) {
            .login-card { grid-template-columns: 1fr; }
            .login-branding { display: none; }
        }
    </style>
</head>
<body>

    <main class="login-container">
        <div class="login-card">
            <div class="login-branding">
                <div class="logo-wrapper">
                    <img src="https://tienderu.com/uploads/logo.png" alt="Tienderu" class="login-logo-saas">
                </div>
                <h3>Ecosistema <span>Digital</span></h3>
                <p style="font-size: 13px; margin-top: 10px; color: var(--gray);">La plataforma IA para el control total de tu negocio.</p>
            </div>

            <div class="login-form-side">
                <div class="tab-switcher">
                    <button class="tab-btn active" onclick="switchTab('login')">INICIAR SESIÓN</button>
                    <button class="tab-btn" onclick="switchTab('register')">CREAR CUENTA</button>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label>Usuario</label>
                        <input type="text" id="l-user" required>
                    </div>
                    <div class="input-group">
                        <label>Contraseña</label>
                        <input type="password" id="l-pass" required>
                    </div>
                    <button type="submit" class="btn-auth">INGRESAR AL PANEL</button>
                    <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> VOLVER AL INICIO</a>
                </form>

                <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
                    <div class="form-grid">
                        <div class="input-group full-w">
                            <label>Plan Inicial</label>
                            <select id="r-plan">
                                <option value="0">Starter - $0 (Gratis)</option>
                                <option value="25000">Enterprise - $25.000</option>
                                <option value="50000">Premium - $50.000</option>
                                <option value="75000">Pro - $75.000</option>
                            </select>
                        </div>
                        <div class="input-group full-w"><label>Nombre Empresa</label><input type="text" id="r-nombre" required></div>
                        <div class="input-group"><label>WhatsApp</label><input type="text" id="r-tel" required></div>
                        <div class="input-group"><label>Ciudad</label><input type="text" id="r-ciu" required></div>
                        <div class="input-group full-w"><label>Usuario</label><input type="text" id="r-user" required></div>
                        <div class="input-group full-w"><label>Contraseña</label><input type="password" id="r-pass" required></div>
                    </div>
                    <button type="submit" class="btn-auth">ACTIVAR MI ECOSISTEMA</button>
                    <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> VOLVER AL INICIO</a>
                </form>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        // Cambiar entre Login y Registro
        function switchTab(type) {
            const isLogin = type === 'login';
            document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
            document.getElementById('registerForm').classList.toggle('hidden', isLogin);
            
            const btns = document.querySelectorAll('.tab-btn');
            btns[0].classList.toggle('active', isLogin);
            btns[1].classList.toggle('active', !isLogin);
        }

        // Detectar parámetros de URL (Planes y Masivos)
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            
            // 1. Forzar pestaña si se solicita registro
            if (params.get('tab') === 'registro' || params.has('plan')) {
                switchTab('register');
            }

            // 2. Mapeo de nombres a valores numéricos para el select
            const planSolicitado = params.get('plan');
            if (planSolicitado) {
                const selectPlan = document.getElementById('r-plan');
                const mapaPlanes = {
                    'free': '0',
                    'enterprise': '25000',
                    'premium': '50000',
                    'pro': '75000'
                };
                
                // Si el plan existe en el mapa, lo seleccionamos
                const valorNumerico = mapaPlanes[planSolicitado.toLowerCase()];
                if (valorNumerico !== undefined) {
                    selectPlan.value = valorNumerico;
                }
            }
        };

        async function handleLogin(e) {
            e.preventDefault();
            // Usamos la función global de script.js
            if (typeof window.authUser === 'function') {
                window.authUser(document.getElementById('l-user').value, document.getElementById('l-pass').value);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            // Redirigimos a la función de registro en script.js
            if (typeof window.handleRegister === 'function') {
                window.handleRegister(e);
            }
        }
    </script>
</body>
</html>
