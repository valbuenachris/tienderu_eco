services:
  manager:
    build: .
    container_name: pos_manager
    ports:
      - "3021:3000"
    volumes:
      # Mapeo idéntico para que la ruta absoluta funcione en ambos lados
      - /opt/manager:/opt/manager
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/pos:/opt/pos                       # Permite que el panel cree las carpetas de clientes
    restart: unless-stopped