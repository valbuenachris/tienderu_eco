services:
  manager:
    build: .
    container_name: pos_manager
    ports:
      - "3021:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Permite que el panel cree otros contenedores
      - /opt/pos:/opt/pos                         # Permite que el panel cree las carpetas de clientes
    restart: unless-stopped